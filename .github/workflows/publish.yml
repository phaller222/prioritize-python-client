# Publish the client to PyPI when a release tag is pushed.
#
# Authentication uses PyPI Trusted Publishing (OpenID Connect): GitHub mints a
# short-lived token for this exact repository and workflow, and PyPI verifies it.
# There is no API token stored anywhere - not in repository secrets, not on the
# network share. The publisher must be registered once in the PyPI project
# settings (see README, "Releasing").
name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Must match the environment name registered with the PyPI trusted publisher.
    environment: pypi
    permissions:
      # Required for Trusted Publishing; this is what replaces the API token.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # The distribution version comes from setup.py (setuptools is the build
      # backend - the version in pyproject.toml's [tool.poetry] block is not
      # what gets built). A tag that disagrees with it would publish a version
      # nobody can find by tag, so fail before anything reaches PyPI.
      - name: Check tag against setup.py version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          setup_version="$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' setup.py)"
          echo "tag=$tag_version setup.py=$setup_version"
          if [ "$tag_version" != "$setup_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION $setup_version in setup.py"
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - uses: pypa/gh-action-pypi-publish@release/v1
